<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GreenSort — BioMatrix</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Animated BG Particles -->
  <div class="bg">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
  </div>

  <header class="nav">
    <div class="brand">
      <div class="logo-blob"></div>
      <span>BioMatrix</span>
    </div>
    <nav class="links">
    </nav>
    <button id="themeToggle" aria-label="Toggle theme">☾</button>
  </header>

  <main class="wrap">
    <section class="hero card tilt" data-tilt>
      <h1><span class="grad">GreenSort</span></h1>
      <div class="cta-row">
        <label for="fileInput" class="btn primary">Upload Images</label>
        <input id="fileInput" type="file" accept="image/*" multiple hidden />
        <button id="openCamera" class="btn ghost">Open Camera</button>
      </div>
    </section>

    <!-- Camera area (hidden until opened) -->
    <section id="cameraCard" class="card camera-card tilt hidden" data-tilt>
      <div class="camera-row">
        <video id="cameraVideo" autoplay playsinline></video>
        <canvas id="cameraCanvas" class="hidden"></canvas>
      </div>
      <div class="camera-controls">
        <button id="captureBtn" class="btn primary">Capture & Analyze</button>
        <button id="closeCamera" class="btn ghost">Close Camera</button>
      </div>
      <div class="camera-hint">Tip: on mobiles allow camera access and switch to the back camera for better results.</div>
    </section>

    <section id="dropzone" class="dropzone card tilt" data-tilt>
      <div class="dz-icon">⬆</div>
      <div class="dz-text">
        <strong>Drag & drop</strong> images here, or click <span class="underline" id="dzClick">browse</span>.
      </div>
    </section>

    <section>
      <div id="results" class="grid"></div>
    </section>
  </main>

  <script>
    const API_URL = "https://greensort-2-0.onrender.com/api/identify";

    async function uploadImages(files) {
        const formData = new FormData();
        for (const f of files) formData.append("images", f);

        const res = await fetch(API_URL, {
            method: "POST",
            mode: "cors",
            body: formData
        });

        return await res.json();
    }
</script>
</body>
</html>
