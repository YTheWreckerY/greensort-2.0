<script type="module">
// -----------------------------
// CONFIG
// -----------------------------
const API_URL: string = "https://greensort-2-0.onrender.com/api/identify";


// -----------------------------
// TYPES
// -----------------------------
interface PredictionItem {
    filename: string;
    name?: string;
    description?: string;
    error?: string;
}

interface PredictionResponse {
    results?: PredictionItem[];
}


// -----------------------------
// UPLOAD FUNCTION
// -----------------------------
async function uploadImages(files: FileList | Blob[]): Promise<PredictionResponse> {
    const formData = new FormData();
    for (const file of files as any) {
        formData.append("images", file);
    }

    const response = await fetch(API_URL, {
        method: "POST",
        body: formData
    });

    return await response.json();
}


// -----------------------------
// DOM ELEMENTS
// -----------------------------
const fileInput = document.getElementById("fileInput") as HTMLInputElement;
const dropzone = document.getElementById("dropzone") as HTMLElement;
const dzClick = document.getElementById("dzClick") as HTMLElement;
const results = document.getElementById("results") as HTMLElement;

const openCamera = document.getElementById("openCamera") as HTMLButtonElement;
const cameraCard = document.getElementById("cameraCard") as HTMLElement;
const cameraVideo = document.getElementById("cameraVideo") as HTMLVideoElement;
const cameraCanvas = document.getElementById("cameraCanvas") as HTMLCanvasElement;
const captureBtn = document.getElementById("captureBtn") as HTMLButtonElement;
const closeCamera = document.getElementById("closeCamera") as HTMLButtonElement;


// -----------------------------
// DISPLAY RESULT CARDS
// -----------------------------
function showResults(data: PredictionResponse): void {
    results.innerHTML = "";
    if (!data?.results) return;

    data.results.forEach((item: PredictionItem) => {
        const card = document.createElement("div");
        card.className = "result-card card";

        const content = item.error
            ? `<p class="error">${item.error}</p>`
            : `
                <p><strong>Name:</strong> ${item.name}</p>
                <p><strong>Description:</strong> ${item.description}</p>
              `;

        card.innerHTML = `
            <h3>${item.filename}</h3>
            ${content}
        `;

        results.appendChild(card);
    });
}


// -----------------------------
// FILE INPUT HANDLER
// -----------------------------
fileInput.addEventListener("change", async () => {
    if (fileInput.files) {
        const data = await uploadImages(fileInput.files);
        showResults(data);
    }
});


// -----------------------------
// DROPZONE
// -----------------------------
dropzone.addEventListener("dragover", (e: DragEvent) => {
    e.preventDefault();
    dropzone.classList.add("hover");
});

dropzone.addEventListener("dragleave", () => {
    dropzone.classList.remove("hover");
});

dropzone.addEventListener("drop", async (e: DragEvent) => {
    e.preventDefault();
    dropzone.classList.remove("hover");

    if (e.dataTransfer?.files) {
        const data = await uploadImages(e.dataTransfer.files);
        showResults(data);
    }
});

dzClick.addEventListener("click", () => fileInput.click());


// -----------------------------
// CAMERA CONTROLS
// -----------------------------
openCamera.addEventListener("click", async () => {
    cameraCard.classList.remove("hidden");

    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    cameraVideo.srcObject = stream;
});

closeCamera.addEventListener("click", () => {
    cameraCard.classList.add("hidden");

    const tracks = cameraVideo.srcObject?.getTracks();
    tracks?.forEach(t => t.stop());
});


captureBtn.addEventListener("click", async () => {
    const ctx = cameraCanvas.getContext("2d");
    if (!ctx) return;

    cameraCanvas.width = cameraVideo.videoWidth;
    cameraCanvas.height = cameraVideo.videoHeight;

    ctx.drawImage(cameraVideo, 0, 0);

    cameraCanvas.toBlob(async (blob) => {
        if (!blob) return;
        const data = await uploadImages([blob]);
        showResults(data);
    }, "image/jpeg");
});

</script>
